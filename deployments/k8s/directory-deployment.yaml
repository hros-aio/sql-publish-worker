apiVersion: apps/v1
kind: Deployment
metadata:
  name: hros-directory-event-worker
  namespace: hros
  labels:
    app.kubernetes.io/name: hros-event-worker
    app.kubernetes.io/component: directory-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hros-event-worker
      app.kubernetes.io/component: directory-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hros-event-worker
        app.kubernetes.io/component: directory-relay
    spec:
      containers:
        - name: relay-worker
          image: hros/event-worker:v1.0.0
          args:
            - run
            - --type=directory
            - --config=/etc/hros/config.yaml
          ports:
            - containerPort: 8080
              name: http-metrics
          env:
            - name: HROS_DIRECTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hros-directory-db-credentials
                  key: password
          volumeMounts:
            - name: config-volume
              mountPath: /etc/hros
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: hros-worker-config
