# HROS Outbox Kafka Relay Worker Configuration Example

setting:
  database:
    host: localhost
    port: 5432
    name: hros_setting
    user: postgres
    password: postgres
    ssl_mode: disable
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 5m
  kafka:
    brokers:
      - localhost:9092
    client_id: hros-setting-event-worker
    topic_prefix: ""
    required_acks: all
    retry_max: 5
    retry_backoff: 250ms
    compression: snappy
    producer_name: hros-setting-service
  outbox:
    batch_size: 100
    poll_interval: 1s
    max_retries: 5
    retry_backoff: 500ms
    claim_timeout: 5s
    processing_timeout: 30s
  worker:
    concurrency: 2
    shutdown_timeout: 15s
  http:
    port: 8081

